# Сайт (Express) — только он может быть на плане free на Render.
# Worker (Telegram-бот) на Render НЕ входит в free — см. experience_factory_bot/render.yaml и деплой бота отдельно (Fly.io, Oracle Free Tier, VPS и т.д.).
# Док: https://render.com/docs/blueprint-spec (plan: free недоступен для type: worker)
services:
  - type: web
    name: exp-factory-web
    runtime: node
    branch: main
    plan: free
    rootDir: WebSayt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
